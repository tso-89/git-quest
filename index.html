<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Git Quest</title>
<meta name="description" content="An interactive git lesson for people who have never run git init, and who now work alongside AI coding agents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* css/tokens.css */
/* ==========================================================================
   tokens.css — the design system.

   Dark-first: the bare :root block is the dark palette, because the lesson is
   a terminal and an IDE and that is the room it belongs in. Light is a full
   re-definition of the same tokens, never a partial override.
   ========================================================================== */

:root {
  /* surfaces */
  --bg:        #0E1116;
  --panel:     #151A21;
  --panel-2:   #1B212A;
  --panel-3:   #212934;
  --line:      #262E39;
  --line-soft: #1E242D;

  /* text */
  --text:      #DDE3EB;
  --text-2:    #AEB8C6;
  --dim:       #7C8796;
  --faint:     #4A5462;

  /* accent + semantics */
  --blue:      #4C9AFF;
  --blue-soft: rgba(76, 154, 255, .14);
  --blue-line: rgba(76, 154, 255, .40);
  --add:       #3FB950;
  --add-soft:  rgba(63, 185, 80, .12);
  --add-line:  rgba(63, 185, 80, .38);
  --del:       #F85149;
  --del-soft:  rgba(248, 81, 73, .12);
  --del-line:  rgba(248, 81, 73, .38);
  --warn:      #E3B341;
  --warn-soft: rgba(227, 179, 65, .12);
  --warn-line: rgba(227, 179, 65, .38);

  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 12px 32px -16px rgba(0, 0, 0, .75);

  /* type */
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --step--1: 12.5px;
  --step-0:  15px;
  --step-1:  17px;
  --step-2:  21px;
  --step-3:  27px;
  --step-4:  34px;

  --radius: 6px;
  --radius-sm: 4px;

  color-scheme: dark light;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #F2F5F9;
    --panel:     #FFFFFF;
    --panel-2:   #EDF1F6;
    --panel-3:   #E3EAF2;
    --line:      #D5DDE7;
    --line-soft: #E6ECF3;

    --text:      #131820;
    --text-2:    #3A4553;
    --dim:       #5E6B7A;
    --faint:     #97A3B2;

    --blue:      #0B62D6;
    --blue-soft: rgba(11, 98, 214, .10);
    --blue-line: rgba(11, 98, 214, .35);
    --add:       #1A7F37;
    --add-soft:  rgba(26, 127, 55, .10);
    --add-line:  rgba(26, 127, 55, .32);
    --del:       #CF222E;
    --del-soft:  rgba(207, 34, 46, .09);
    --del-line:  rgba(207, 34, 46, .30);
    --warn:      #9A6700;
    --warn-soft: rgba(154, 103, 0, .12);
    --warn-line: rgba(154, 103, 0, .32);

    --shadow: 0 1px 2px rgba(19, 24, 32, .06), 0 12px 32px -18px rgba(19, 24, 32, .28);
  }
}

:root[data-theme="light"] {
  --bg:        #F2F5F9;
  --panel:     #FFFFFF;
  --panel-2:   #EDF1F6;
  --panel-3:   #E3EAF2;
  --line:      #D5DDE7;
  --line-soft: #E6ECF3;

  --text:      #131820;
  --text-2:    #3A4553;
  --dim:       #5E6B7A;
  --faint:     #97A3B2;

  --blue:      #0B62D6;
  --blue-soft: rgba(11, 98, 214, .10);
  --blue-line: rgba(11, 98, 214, .35);
  --add:       #1A7F37;
  --add-soft:  rgba(26, 127, 55, .10);
  --add-line:  rgba(26, 127, 55, .32);
  --del:       #CF222E;
  --del-soft:  rgba(207, 34, 46, .09);
  --del-line:  rgba(207, 34, 46, .30);
  --warn:      #9A6700;
  --warn-soft: rgba(154, 103, 0, .12);
  --warn-line: rgba(154, 103, 0, .32);

  --shadow: 0 1px 2px rgba(19, 24, 32, .06), 0 12px 32px -18px rgba(19, 24, 32, .28);
}

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
}

button { cursor: pointer; }
button[disabled] { cursor: not-allowed; opacity: .45; }

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: 3px;
}

code, pre, kbd { font-family: var(--mono); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 6px;
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover { background: var(--faint); background-clip: content-box; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}
</style>
<style>
/* css/app.css */
/* ==========================================================================
   app.css — the lesson shell.

   Layout: a fixed-height app. Header, then a stage of two panes (three in the
   agent chapter). Each pane scrolls on its own so the terminal never runs away
   down the page.
   ========================================================================== */

.app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  min-height: 0;
}

/* ------------------------------------------------------------------- header */

.hud {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 0 18px;
  height: 52px;
  flex: none;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 9px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--text);
}
.brand .brand-mark { color: var(--blue); }
.brand .brand-sub {
  font-weight: 400;
  font-size: 10.5px;
  letter-spacing: .12em;
  color: var(--dim);
  text-transform: uppercase;
}

.hud-stats {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
}
.hud-level { color: var(--blue); font-weight: 700; letter-spacing: .06em; }
.xp-track {
  width: 104px;
  height: 5px;
  border-radius: 3px;
  background: var(--panel-3);
  overflow: hidden;
}
.xp-fill {
  display: block;
  height: 100%;
  width: 0;
  background: var(--blue);
  transition: width .45s cubic-bezier(.2, .7, .3, 1);
}
.hud-streak { color: var(--warn); white-space: nowrap; }
.hud-streak::before { content: "◆ "; }

.map {
  display: flex;
  gap: 4px;
  margin-left: auto;
  align-items: center;
  overflow-x: auto;
  padding: 4px 0;
}
.node {
  width: 26px;
  height: 26px;
  flex: none;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--dim);
  font-family: var(--mono);
  font-size: 10px;
  display: grid;
  place-items: center;
  padding: 0;
  transition: transform .15s ease, border-color .15s ease;
}
.node:hover { border-color: var(--faint); color: var(--text); transform: translateY(-1px); }
.node.is-done { background: var(--add-soft); border-color: var(--add); color: var(--add); }
.node.is-here {
  border-color: var(--blue);
  color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-soft);
}
.node.is-done.is-here { background: var(--blue-soft); }

.hud-actions { display: flex; gap: 8px; align-items: center; }

.btn {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text-2);
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}
.btn:hover { border-color: var(--faint); color: var(--text); }
.btn-primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #FFFFFF;
  font-weight: 500;
}
.btn-primary:hover { filter: brightness(1.08); border-color: var(--blue); color: #FFFFFF; }

/* -------------------------------------------------------------------- stage */

.stage {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 0.92fr) minmax(0, 1.08fr);
}
.stage.has-agent {
  grid-template-columns: minmax(0, 0.82fr) minmax(0, 1fr) 282px;
}

/* ------------------------------------------------------------------- lesson */

.lesson {
  min-height: 0;
  overflow-y: auto;
  border-right: 1px solid var(--line);
  background: var(--bg);
}
.lesson-inner { padding: 30px 34px 60px; max-width: 62ch; }

.ch-eyebrow {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--dim);
  display: flex;
  gap: 10px;
  align-items: center;
}
.ch-tag {
  color: var(--blue);
  background: var(--blue-soft);
  border-radius: 20px;
  padding: 2px 9px;
  letter-spacing: .1em;
}
.ch-title {
  font-size: var(--step-4);
  line-height: 1.1;
  letter-spacing: -.022em;
  font-weight: 600;
  margin: 12px 0 6px;
  text-wrap: balance;
}
.ch-sub {
  margin: 0 0 26px;
  color: var(--dim);
  font-size: var(--step-1);
  line-height: 1.45;
}

.prose p { margin: 0 0 15px; color: var(--text-2); }
.prose h3 {
  font-size: var(--step-2);
  letter-spacing: -.015em;
  margin: 30px 0 12px;
  font-weight: 600;
  color: var(--text);
}
.prose strong { color: var(--text); font-weight: 600; }
.prose em { color: var(--text); font-style: italic; }
.prose code {
  font-size: .86em;
  background: var(--panel-2);
  border: 1px solid var(--line-soft);
  border-radius: 3px;
  padding: 1px 5px;
  color: var(--text);
}

.codeblock {
  font-size: 12.5px;
  line-height: 1.65;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  overflow-x: auto;
  margin: 0 0 16px;
  color: var(--text-2);
}

.note {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  align-items: start;
  margin: 20px 0;
  padding: 13px 15px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--panel);
}
.note p { margin: 0; font-size: 14.5px; }
.note-tag {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 3px;
  white-space: nowrap;
}
.note-key { border-color: var(--blue-line); }
.note-key .note-tag { background: var(--blue-soft); color: var(--blue); }
.note-warn { border-color: var(--del-line); }
.note-warn .note-tag { background: var(--del-soft); color: var(--del); }
.note-tip { border-color: var(--add-line); }
.note-tip .note-tag { background: var(--add-soft); color: var(--add); }

/* command palette in the lesson */
.cmds {
  margin: 22px 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--panel);
}
.cmds-h {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--dim);
  padding: 9px 14px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
}
.cmd {
  display: grid;
  grid-template-columns: minmax(0, auto) 1fr auto;
  gap: 14px;
  align-items: baseline;
  width: 100%;
  text-align: left;
  padding: 8px 14px;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  background: transparent;
  transition: background .12s ease;
}
.cmd:last-child { border-bottom: 0; }
.cmd:hover { background: var(--panel-2); }
.cmd code { font-size: 12.5px; color: var(--blue); white-space: nowrap; }
.cmd span { font-size: 13px; color: var(--dim); }
.cmd-go {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--faint);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 2px 8px;
  justify-self: end;
  white-space: nowrap;
}
.cmd:hover .cmd-go { color: var(--blue); border-color: var(--blue-line); }

/* Anatomy of the prompt. The line renders exactly as the terminal shows it;
   the legend explains each part without being able to distort the line. */
.anatomy {
  margin: 20px 0;
  padding: 14px 16px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.an-line {
  display: block;
  font-size: 13px;
  line-height: 1.6;
  padding-bottom: 12px;
  margin-bottom: 12px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  white-space: nowrap;
}
.an-user { color: var(--add); }
.an-where { color: var(--blue); }
.an-dollar { color: var(--warn); }
.an-cmd { color: var(--text); }

.an-keys {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(184px, 1fr));
  gap: 12px 20px;
}
.an-keys li {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}
.an-swatch {
  font-family: var(--mono);
  font-size: 11.5px;
  margin-bottom: 3px;
  overflow-wrap: anywhere;
}
.an-keys b {
  font-family: var(--mono);
  font-size: 9.5px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 500;
  color: var(--text-2);
}
.an-sub { font-size: 11.5px; line-height: 1.4; color: var(--dim); }

/* comparison tables */
.compare {
  width: 100%;
  border-collapse: collapse;
  margin: 20px 0;
  font-size: 14px;
  display: block;
  overflow-x: auto;
}
.compare th {
  text-align: left;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--dim);
  font-weight: 500;
  padding: 0 16px 8px 0;
  border-bottom: 1px solid var(--line);
}
.compare td {
  padding: 9px 16px 9px 0;
  border-bottom: 1px solid var(--line-soft);
  color: var(--text-2);
  vertical-align: top;
}
.compare tr td:first-child { color: var(--text); }
.compare code { font-size: .85em; }

/* the three trays */
.trays {
  display: grid;
  grid-template-columns: 1fr auto 1fr auto 1fr;
  gap: 8px;
  align-items: stretch;
  margin: 22px 0;
}
.tray {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--panel);
  padding: 12px 13px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.tray.is-sealed { background: var(--panel-2); border-style: solid; border-color: var(--blue-line); }
.tray-h {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--blue);
}
.tray-p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--dim); }
.tray-c { font-size: 11px; color: var(--text-2); margin-top: auto; }
.tray-arrow {
  display: grid;
  place-items: center;
  font-family: var(--mono);
  font-size: 9.5px;
  color: var(--dim);
  writing-mode: vertical-rl;
  padding: 0 2px;
}
.tray-arrow span { transform: rotate(180deg); }
.tray-arrow::after { content: ""; }

/* agent file cards */
.agentfiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 10px;
  margin: 20px 0;
}
.af {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 12px 13px;
  background: var(--panel);
}
.af-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.af-n { font-weight: 600; font-size: 14px; }
.af-f { font-size: 11px; color: var(--blue); }
.af-w { margin: 7px 0 0; font-size: 12.5px; color: var(--dim); line-height: 1.5; }
.af-g { margin: 7px 0 0; font-size: 12.5px; color: var(--text-2); line-height: 1.5; }

/* ------------------------------------------------------------------- quest */

.quest {
  margin: 0 0 34px;
  border: 1px solid var(--blue-line);
  border-radius: var(--radius);
  background: var(--panel);
  overflow: hidden;
}
.quest.is-complete { border-color: var(--add); }
.quest-h {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 15px;
  background: var(--blue-soft);
  border-bottom: 1px solid var(--line);
}
.quest.is-complete .quest-h { background: var(--add-soft); }
.quest-tag {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--blue);
  font-weight: 600;
}
.quest.is-complete .quest-tag { color: var(--add); }
.quest-count {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--dim);
  font-variant-numeric: tabular-nums;
}
.quest-t { margin: 15px 15px 5px; font-size: var(--step-1); font-weight: 600; }
.quest-b { margin: 0 15px 14px; font-size: 13.5px; color: var(--dim); }
.quest-b code, .qs-hint-text code { font-size: .87em; color: var(--text-2); }

.qs-list { list-style: none; margin: 0; padding: 0 15px 15px; display: flex; flex-direction: column; gap: 2px; }
.qs {
  display: grid;
  grid-template-columns: 20px 1fr;
  gap: 9px;
  align-items: start;
  padding: 7px 0;
  border-bottom: 1px solid var(--line-soft);
}
.qs:last-child { border-bottom: 0; }
.qs-mark {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
  padding-top: 2px;
  text-align: center;
}
.qs.is-done .qs-mark { color: var(--add); }
.qs.is-current .qs-mark { color: var(--blue); }
/* Grid, not wrapping flex, so the Hint button lands in the same place on
   every row regardless of how long the label is. */
.qs-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 6px 10px;
  align-items: baseline;
}
.qs-label { font-size: 13.5px; color: var(--dim); min-width: 0; }
.qs.is-done .qs-label { color: var(--text-2); text-decoration: line-through; text-decoration-color: var(--faint); }
.qs.is-current .qs-label { color: var(--text); font-weight: 500; }
.qs-hint {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: .06em;
  padding: 2px 8px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--dim);
  flex: none;
}
.qs-hint:hover { color: var(--blue); border-color: var(--blue-line); }
.qs-hint-text {
  grid-column: 1 / -1;
  margin: 2px 0;
  font-size: 12.5px;
  color: var(--text-2);
  padding: 8px 11px;
  background: var(--panel-2);
  border-radius: var(--radius-sm);
}

.quest-done {
  border-top: 1px solid var(--line);
  background: var(--add-soft);
  padding: 14px 15px;
}
.quest-outro { margin: 0 0 12px; font-size: 14px; color: var(--text); }
.quest-done-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.xp-won {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  color: var(--add);
  letter-spacing: .04em;
}

.finish-list { padding-left: 20px; margin: 0 0 20px; }
.finish-list li { margin-bottom: 6px; color: var(--text-2); font-size: 14.5px; }

/* --------------------------------------------------------------- work pane */

.work {
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--panel);
}
.work-tabs {
  display: flex;
  flex: none;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.work-tab {
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 10px 16px;
  border: 0;
  border-right: 1px solid var(--line);
  background: transparent;
  color: var(--dim);
  box-shadow: inset 0 -2px 0 transparent;
}
.work-tab:hover { color: var(--text-2); }
.work-tab.is-on {
  color: var(--text);
  background: var(--bg);
  box-shadow: inset 0 -2px 0 var(--blue);
}

.gd-side { border-right: 1px solid var(--line); display: flex; flex-direction: column; }

.vs { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--panel); }

}

}

.vs-legend { list-style: none; margin: 0; padding: 11px 13px; border-top: 1px solid var(--line); background: var(--panel-2); }

.ag-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 8px; }

.form-grid { display: flex; flex-direction: column; gap: 4px; }

  100% { transform: scale(1); }

}

      if (!cmd.args.length) return err('rm: give it a filename');
      var missing = [];
      cmd.args.forEach(function (f) { if (!eng.removeFile(f)) missing.push(f); });
      if (missing.length) return err('rm: ' + missing.join(', ') + ': No such file');
      return ok();
    },

    clear: function () { return { lines: [], ok: true, clear: true }; },

    help: function () {
      return ok([
        out('This sandbox understands a useful slice of a real shell:', 'bold'),
        out(''),
        out('  files    ls  cat  echo "text" > file  touch  mkdir  rm  cd  pwd', 'accent'),
        out('  git      init  status  add  restore  commit  log  diff  show', 'accent'),
        out('           branch  switch  merge  reset  revert  reflog', 'accent'),
        out('           remote  push  pull  clone  config', 'accent'),
        out('  github   gh repo create  gh auth status', 'accent'),
        out(''),
        out('Nothing you type here touches your real computer.', 'dim'),
        out('Stuck? Press the Hint button on the quest card.', 'dim')
      ]);
    }
  };

  // -------------------------------------------------------------- git verbs

  function requireRepo(eng) {
    if (!eng.activeRepo()) {
      return err('fatal: not a git repository (or any of the parent directories): .git');
    }
    return null;
  }

  var git = {
    init: function (eng, cmd) {
      var target = cmd.args[0] ? resolvePath(eng.cwd, cmd.args[0]) : eng.cwd;
      if (eng.repo && eng.repo.root === target) {
        return ok([out('Reinitialized existing Git repository in ' + target + '/.git/', 'dim')]);
      }
      eng.init(target);
      if (cmd.args[0]) eng.cwd = target;
      return ok([
        out('Initialized empty Git repository in ' + target + '/.git/', 'add'),
        out('A hidden .git folder now sits beside your files. That is the whole repository.', 'dim')
      ]);
    },

    status: function (eng) {
      var guard = requireRepo(eng); if (guard) return guard;
      var s = eng.status();
      var lines = [];
      lines.push(out('On branch ' + (s.branch || 'HEAD detached'), 'bold'));
      if (s.unmerged.length) {
        lines.push(out('You have unmerged paths.', 'warn'));
        lines.push(out('  (fix conflicts and then run "git commit")', 'dim'));
        lines.push(out('  (use "git add <file>..." to mark resolution)', 'dim'));
        lines.push(out(''));
        lines.push(out('Unmerged paths:'));
        s.unmerged.forEach(function (f) {
          lines.push(out('        ' + f.state + ':   ' + f.path, 'del'));
        });
      } else if (s.merging) {
        lines.push(out('All conflicts fixed but you are still merging.', 'warn'));
        lines.push(out('  (use "git commit" to conclude merge)', 'dim'));
      }
      if (s.ahead) lines.push(out("Your branch is ahead of 'origin/" + s.branch + "' by " + s.ahead + ' commit' + (s.ahead === 1 ? '' : 's') + '.', 'dim'));
      if (!eng.headSha() && !s.staged.length) lines.push(out('No commits yet', 'dim'));

      if (s.staged.length) {
        lines.push(out(''));
        lines.push(out('Changes to be committed:'));
        lines.push(out('  (use "git restore --staged <file>..." to unstage)', 'dim'));
        s.staged.forEach(function (f) { lines.push(out('        ' + f.state + ':   ' + f.path, 'add')); });
      }
      if (s.unstaged.length) {
        lines.push(out(''));
        lines.push(out('Changes not staged for commit:'));
        lines.push(out('  (use "git add <file>..." to include in what will be committed)', 'dim'));
        s.unstaged.forEach(function (f) { lines.push(out('        ' + f.state + ':   ' + f.path, 'del')); });
      }
      if (s.untracked.length) {
        lines.push(out(''));
        lines.push(out('Untracked files:'));
        lines.push(out('  (use "git add <file>..." to include in what will be committed)', 'dim'));
        s.untracked.forEach(function (f) { lines.push(out('        ' + f.path, 'del')); });
      }
      if (s.clean) {
        lines.push(out(''));
        lines.push(out('nothing to commit, working tree clean', 'add'));
      }
      return ok(lines);
    },

    add: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      if (!cmd.args.length) return err('Nothing specified, nothing added.\nhint: Maybe you wanted to say "git add ."');
      var work = eng.worktree();
      var repo = eng.activeRepo();
      var staged = [];
      var refused = [];
      cmd.args.forEach(function (arg) {
        if (arg === '.' || arg === '-A' || arg === '*') {
          Object.keys(work).forEach(function (p) {
            if (eng.isIgnored(p)) return;
            eng.stage(p);
            staged.push(p);
          });
          Object.keys(repo.index).forEach(function (p) {
            if (!Object.prototype.hasOwnProperty.call(work, p)) { eng.stage(p); staged.push(p); }
          });
          return;
        }
        var rel = arg.replace(/^\.\//, '');
        if (!Object.prototype.hasOwnProperty.call(work, rel)
          && !Object.prototype.hasOwnProperty.call(repo.index, rel)) {
          refused.push(rel);
          return;
        }
        eng.stage(rel);
        staged.push(rel);
      });
      if (refused.length) {
        return err("fatal: pathspec '" + refused[0] + "' did not match any files");
      }
      if (repo.merging) {
        repo.merging.conflicts = repo.merging.conflicts.filter(function (p) {
          return staged.indexOf(p) === -1;
        });
      }
      var lines = [];
      if (staged.length) {
        lines.push(out('Staged ' + staged.length + ' file' + (staged.length === 1 ? '' : 's') + '. Nothing is permanent yet.', 'dim'));
      }
      return ok(lines);
    },

    restore: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      var toStaged = !!cmd.flags['--staged'];
      if (!cmd.args.length) return err('fatal: you must specify path(s) to restore');
      var touched = [];
      cmd.args.forEach(function (arg) {
        var rel = arg.replace(/^\.\//, '');
        if (arg === '.') {
          var all = toStaged ? Object.keys(repo.index) : Object.keys(repo.index);
          all.forEach(function (p) {
            if (toStaged) eng.unstage(p);
            else eng.fs[repo.root + '/' + p] = repo.index[p];
            touched.push(p);
          });
          return;
        }
        if (toStaged) { eng.unstage(rel); touched.push(rel); return; }
        if (!Object.prototype.hasOwnProperty.call(repo.index, rel)) {
          touched.push(null);
          return;
        }
        eng.fs[repo.root + '/' + rel] = repo.index[rel];
        touched.push(rel);
      });
      if (touched.indexOf(null) !== -1) {
        return err("error: pathspec did not match any file known to git");
      }
      return ok([out(toStaged
        ? 'Unstaged ' + touched.length + ' file(s). The edits are still on disk.'
        : 'Restored ' + touched.length + ' file(s) from the staging area.', 'add')]);
    },

    rm: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      if (cmd.flags['--cached']) {
        cmd.args.forEach(function (a) { delete repo.index[a]; });
        return ok([out("rm '" + cmd.args.join("' '") + "'"),
          out('Removed from git, left on disk. This is how you un-commit a file you should not have added.', 'dim')]);
      }
      cmd.args.forEach(function (a) { eng.removeFile(a); delete repo.index[a]; });
      return ok([out("rm '" + cmd.args.join("' '") + "'")]);
    },

    commit: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      var message = flagValue(cmd.tokens, '-m') || flagValue(cmd.tokens, '--message');
      if (cmd.flags['-am'] || (cmd.flags['-a'] && cmd.tokens.indexOf('-m') !== -1)) {
        Object.keys(eng.worktree()).forEach(function (p) {
          if (Object.prototype.hasOwnProperty.call(repo.index, p)) eng.stage(p);
        });
        if (!message) message = flagValue(cmd.tokens, '-am');
      }
      if (!message) {
        return err('hint: no commit message given.\nUse:  git commit -m "what changed and why"');
      }
      var s = eng.status();
      if (s.unmerged.length) {
        return err('error: Committing is not possible because you have unmerged files.\n'
          + '  ' + s.unmerged.map(function (f) { return f.path; }).join('\n  ')
          + '\nhint: Fix them up in the work tree, then "git add" each one.');
      }
      if (!s.staged.length && !repo.merging) {
        var hint = s.unstaged.length || s.untracked.length
          ? 'nothing added to commit but untracked files present (use "git add")'
          : 'nothing to commit, working tree clean';
        return err('On branch ' + s.branch + '\n' + hint);
      }
      var extra = repo.merging ? [repo.merging.theirSha] : [];
      var commit = eng.commit(message, extra);
      var files = s.staged.length;
      var added = 0;
      var removed = 0;
      var head = commit.parents[0] ? repo.objects[commit.parents[0]].tree : {};
      s.staged.forEach(function (f) {
        diffLines(head[f.path], commit.tree[f.path]).forEach(function (c) {
          if (c.op === '+') added += 1;
          if (c.op === '-') removed += 1;
        });
      });
      return ok([
        out('[' + (s.branch || 'detached') + ' ' + commit.sha + '] ' + message, 'bold'),
        out(' ' + files + ' file' + (files === 1 ? '' : 's') + ' changed, '
          + added + ' insertion(+), ' + removed + ' deletion(-)', 'dim')
      ]);
    },

    log: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      var chain = eng.ancestry(eng.headSha());
      if (!chain.length) return err("fatal: your current branch 'main' does not have any commits yet");
      var oneline = cmd.flags['--oneline'];
      var limit = cmd.flags['-n'] ? Number(flagValue(cmd.tokens, '-n')) : chain.length;
      var lines = [];
      var branchesBySha = {};
      Object.keys(repo.branches).forEach(function (b) {
        branchesBySha[repo.branches[b]] = (branchesBySha[repo.branches[b]] || []).concat(b);
      });
      chain.slice(0, limit).forEach(function (sha, i) {
        var c = repo.objects[sha];
        var decoration = branchesBySha[sha] ? ' (' + branchesBySha[sha].join(', ') + (i === 0 ? ' -> HEAD' : '') + ')' : '';
        if (oneline) {
          lines.push({ text: sha + ' ' + c.message, cls: 'accent', decoration: decoration });
        } else {
          lines.push(out('commit ' + sha + decoration, 'accent'));
          if (c.parents.length > 1) lines.push(out('Merge: ' + c.parents.join(' '), 'dim'));
          lines.push(out('Author: ' + c.author + ' <' + c.email + '>', 'dim'));
          lines.push(out('Date:   ' + fmtDate(c.date), 'dim'));
          lines.push(out(''));
          lines.push(out('    ' + c.message));
          lines.push(out(''));
        }
      });
      return ok(lines);
    },

    show: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      var sha = eng.resolveRef(cmd.args[0] || 'HEAD');
      if (!sha) return err("fatal: bad revision '" + (cmd.args[0] || 'HEAD') + "'");
      var c = repo.objects[sha];
      var parentTree = c.parents[0] ? repo.objects[c.parents[0]].tree : {};
      var lines = [
        out('commit ' + sha, 'accent'),
        out('Author: ' + c.author + ' <' + c.email + '>', 'dim'),
        out('Date:   ' + fmtDate(c.date), 'dim'),
        out(''),
        out('    ' + c.message),
        out('')
      ];
      var paths = {};
      Object.keys(parentTree).concat(Object.keys(c.tree)).forEach(function (p) { paths[p] = true; });
      Object.keys(paths).sort().forEach(function (p) {
        renderDiff(p, parentTree[p], c.tree[p]).forEach(function (l) { lines.push(l); });
      });
      return ok(lines);
    },

    diff: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      var staged = cmd.flags['--staged'] || cmd.flags['--cached'];
      var from = staged ? eng.headTree() : repo.index;
      var to = staged ? repo.index : eng.worktree();
      var lines = [];
      var paths = {};
      Object.keys(from).concat(Object.keys(to)).forEach(function (p) { paths[p] = true; });
      Object.keys(paths).sort().forEach(function (p) {
        if (!staged && !Object.prototype.hasOwnProperty.call(repo.index, p)) return;
        renderDiff(p, from[p], to[p]).forEach(function (l) { lines.push(l); });
      });
      if (!lines.length) {
        return ok([out(staged
          ? 'Nothing staged. `git diff --staged` shows what a commit would contain.'
          : 'No unstaged changes. `git diff` shows edits you have not staged yet.', 'dim')]);
      }
      return ok(lines);
    },

    branch: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      if (cmd.flags['-d'] || cmd.flags['-D']) {
        var name = flagValue(cmd.tokens, cmd.flags['-d'] ? '-d' : '-D');
        if (name === eng.currentBranch()) return err("error: cannot delete branch '" + name + "' checked out");
        delete repo.branches[name];
        return ok([out('Deleted branch ' + name + '.')]);
      }
      if (!cmd.args.length) {
        var current = eng.currentBranch();
        return ok(Object.keys(repo.branches).sort().map(function (b) {
          return out((b === current ? '* ' : '  ') + b, b === current ? 'add' : 'out');
        }));
      }
      var newName = cmd.args[0];
      if (repo.branches[newName]) return err("fatal: a branch named '" + newName + "' already exists");
      var head = eng.headSha();
      if (!head) return err('fatal: not a valid object name: ' + (eng.currentBranch() || 'HEAD'));
      repo.branches[newName] = head;
      return ok([out("Created branch '" + newName + "'. It points at the same commit you are on.", 'dim')]);
    },

    switch: function (eng, cmd) { return checkoutBranch(eng, cmd, 'switch'); },
    checkout: function (eng, cmd) { return checkoutBranch(eng, cmd, 'checkout'); },

    merge: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      var theirName = cmd.args[0];
      if (!theirName) return err('fatal: no branch named for merge');
      var theirSha = cmd._sha || eng.resolveRef(theirName);
      if (!theirSha) return err("merge: " + theirName + " - not something we can merge");
      var ourSha = eng.headSha();
      if (ourSha === theirSha) return ok([out('Already up to date.', 'dim')]);

      var base = eng.mergeBase(ourSha, theirSha);
      if (base === ourSha) {
        repo.branches[eng.currentBranch()] = theirSha;
        eng.checkoutTree(repo.objects[theirSha].tree);
        eng.log('merge', theirSha, 'fast-forward to ' + theirName);
        return ok([
          out('Updating ' + ourSha + '..' + theirSha),
          out('Fast-forward', 'add'),
          out('No merge commit needed — your branch had not moved on.', 'dim')
        ]);
      }

      var merged = eng.mergeTrees(
        base ? repo.objects[base].tree : {},
        repo.objects[ourSha].tree,
        repo.objects[theirSha].tree,
        'HEAD',
        theirName
      );
      Object.keys(eng.worktree()).forEach(function (p) { delete eng.fs[repo.root + '/' + p]; });
      Object.keys(merged.tree).forEach(function (p) { eng.fs[repo.root + '/' + p] = merged.tree[p]; });

      if (merged.conflicts.length) {
        repo.merging = { theirSha: theirSha, theirName: theirName, conflicts: merged.conflicts };
        merged.conflicts.forEach(function (p) { delete repo.index[p]; });
        Object.keys(merged.tree).forEach(function (p) {
          if (merged.conflicts.indexOf(p) === -1) repo.index[p] = merged.tree[p];
        });
        var lines = [out('Auto-merging ' + merged.conflicts.join(', '), 'dim')];
        merged.conflicts.forEach(function (p) {
          lines.push(out('CONFLICT (content): Merge conflict in ' + p, 'del'));
        });
        lines.push(out('Automatic merge failed; fix conflicts and then commit the result.', 'warn'));
        lines.push(out('Open the file. Keep the lines you want, delete the <<<<<<< ======= >>>>>>> markers, then git add it.', 'dim'));
        return fail(lines);
      }

      repo.index = merged.tree;
      var mc = eng.commit("Merge branch '" + theirName + "'", [theirSha]);
      return ok([
        out('Merge made by the \'ort\' strategy.', 'add'),
        out('[' + eng.currentBranch() + ' ' + mc.sha + '] Merge branch \'' + theirName + "'", 'dim')
      ]);
    },

    reset: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      var mode = cmd.flags['--hard'] ? 'hard' : (cmd.flags['--soft'] ? 'soft' : 'mixed');
      var ref = cmd.args[0] || 'HEAD';
      var sha = eng.resolveRef(ref);
      if (!sha) return err("fatal: ambiguous argument '" + ref + "': unknown revision");
      var tree = repo.objects[sha].tree;
      if (repo.HEAD.ref) repo.branches[repo.HEAD.ref] = sha;
      else repo.HEAD.sha = sha;
      if (mode === 'mixed') repo.index = JSON.parse(JSON.stringify(tree));
      if (mode === 'hard') eng.checkoutTree(tree);
      eng.log('reset', sha, 'reset --' + mode + ' ' + ref);
      var note = {
        soft: 'HEAD moved. Your staging area and files are untouched.',
        mixed: 'HEAD moved and staging was reset. Your edits are still on disk.',
        hard: 'HEAD, staging and your files all moved. Anything uncommitted is gone — but see git reflog.'
      };
      return ok([
        out('HEAD is now at ' + sha + ' ' + repo.objects[sha].message),
        out(note[mode], mode === 'hard' ? 'warn' : 'dim')
      ]);
    },

    revert: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      var sha = eng.resolveRef(cmd.args[0] || 'HEAD');
      if (!sha) return err("fatal: bad revision '" + (cmd.args[0] || 'HEAD') + "'");
      var target = repo.objects[sha];
      var parentTree = target.parents[0] ? repo.objects[target.parents[0]].tree : {};
      var current = JSON.parse(JSON.stringify(repo.index));
      Object.keys(target.tree).forEach(function (p) {
        if (Object.prototype.hasOwnProperty.call(parentTree, p)) current[p] = parentTree[p];
        else delete current[p];
      });
      Object.keys(parentTree).forEach(function (p) { current[p] = parentTree[p]; });
      repo.index = current;
      eng.checkoutTree(current);
      var c = eng.commit('Revert "' + target.message + '"');
      return ok([
        out('[' + eng.currentBranch() + ' ' + c.sha + '] Revert "' + target.message + '"', 'add'),
        out('The old commit is still in your history. Revert undoes by adding, never by erasing.', 'dim')
      ]);
    },

    reflog: function (eng) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      if (!repo.reflog.length) return ok([out('No history yet.', 'dim')]);
      var lines = repo.reflog.map(function (e, i) {
        return out(e.sha + ' HEAD@{' + i + '}: ' + e.action + ': ' + e.message, i === 0 ? 'accent' : 'out');
      });
      lines.push(out(''));
      lines.push(out('Every one of these is still reachable. git reset --hard HEAD@{1} takes you back.', 'dim'));
      return ok(lines);
    },

    remote: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      if (cmd.args[0] === 'add') {
        var name = cmd.args[1];
        var url = cmd.args[2];
        if (!name || !url) return err('usage: git remote add <name> <url>');
        eng.remotes[name] = eng.remotes[name] || { url: url, branches: {}, objects: {} };
        eng.remotes[name].url = url;
        repo.remote = name;
        return ok([out("Remote '" + name + "' now points at " + url, 'dim')]);
      }
      if (!repo.remote) return ok([out('(no remotes yet — add one with git remote add origin <url>)', 'dim')]);
      return ok([out(repo.remote + '\t' + eng.remotes[repo.remote].url + ' (fetch)'),
        out(repo.remote + '\t' + eng.remotes[repo.remote].url + ' (push)')]);
    },

    push: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      if (!repo.remote) {
        return err("fatal: No configured push destination.\nhint: git remote add origin https://github.com/you/my-first-repo.git");
      }
      var branch = eng.currentBranch();
      if (!branch) return err('fatal: You are not currently on a branch.');
      var sha = repo.branches[branch];
      if (!sha) return err('error: src refspec ' + branch + ' does not match any');
      var remote = eng.remotes[repo.remote];
      var before = remote.branches[branch];
      var pushed = eng.aheadCount();
      remote.branches[branch] = sha;
      eng.ancestry(sha).forEach(function (s) { remote.objects[s] = repo.objects[s]; });
      return ok([
        out('Enumerating objects: ' + (pushed * 3 + 1) + ', done.', 'dim'),
        out('To ' + remote.url, 'dim'),
        out('   ' + (before ? before.slice(0, 7) + '..' + sha : '[new branch]      ' + branch + ' -> ' + branch), 'add'),
        out(pushed
          ? pushed + ' commit' + (pushed === 1 ? '' : 's') + ' are now on GitHub too. Your laptop is no longer the only copy.'
          : 'Everything up to date.', 'dim')
      ]);
    },

    pull: function (eng, cmd) {
      var guard = requireRepo(eng); if (guard) return guard;
      var repo = eng.activeRepo();
      if (!repo.remote) return err('fatal: no remote configured');
      var remote = eng.remotes[repo.remote];
      var branch = eng.currentBranch();
      var theirSha = remote.branches[branch];
      if (!theirSha) return ok([out('Already up to date.', 'dim')]);
      Object.keys(remote.objects).forEach(function (s) { repo.objects[s] = remote.objects[s]; });
      var ourSha = repo.branches[branch];
      if (ourSha === theirSha) return ok([out('Already up to date.', 'dim')]);
      return git.merge(eng, {
        args: [repo.remote + '/' + branch],
        flags: {},
        tokens: [],
        _sha: theirSha
      });
    },

    clone: function (eng, cmd) {
      var url = cmd.args[0];
      if (!url) return err('fatal: You must specify a repository to clone.');
      var name = cmd.args[1] || url.replace(/\.git$/, '').split('/').pop();
      var dest = resolvePath(eng.cwd, name);
      var source = eng.remotes.origin;
      if (!source) return err('fatal: repository \'' + url + '\' not found');
      eng.init(dest);
      var repo = eng.repo;
      repo.remote = 'origin';
      Object.keys(source.objects).forEach(function (s) { repo.objects[s] = source.objects[s]; });
      Object.keys(source.branches).forEach(function (b) { repo.branches[b] = source.branches[b]; });
      repo.HEAD = { ref: Object.keys(source.branches)[0] || 'main' };
      var prev = eng.cwd;
      eng.cwd = dest;
      eng.checkoutTree(eng.headTree());
      eng.cwd = prev;
      return ok([
        out("Cloning into '" + name + "'...", 'dim'),
        out('remote: Enumerating objects: ' + Object.keys(source.objects).length * 3 + ', done.', 'dim'),
        out('Receiving objects: 100%, done.', 'add'),
        out('You now have the full history — every commit, not just the latest files. cd ' + name, 'dim')
      ]);
    },

    config: function (eng, cmd) {
      var key = cmd.args[0];
      var value = cmd.args.slice(1).join(' ');
      if (!key) return ok(Object.keys(eng.config).map(function (k) { return out(k + '=' + eng.config[k]); }));
      if (!value) return ok([out(eng.config[key] === undefined ? '' : eng.config[key])]);
      eng.config[key] = value;
      return ok([out(key + ' set to ' + value, 'dim')]);
    }
  };

  function checkoutBranch(eng, cmd, verb) {
    var guard = requireRepo(eng); if (guard) return guard;
    var repo = eng.activeRepo();
    var create = cmd.flags['-c'] || cmd.flags['-b'];

      + '    <input class="term-input" data-term-input autocomplete="off" autocorrect="off"'
      + '           autocapitalize="off" spellcheck="false"'
      + '           aria-label="Terminal command input" />'
      + '  </div>'
      + '</div>';

    var scroll = mount.querySelector('[data-term-scroll]');
    var outEl = mount.querySelector('[data-term-out]');
    var psEl = mount.querySelector('[data-term-ps]');
    var input = mount.querySelector('[data-term-input]');
    // Chapter 00 uses this to say "you can type in here" to someone who has
    // never seen a terminal and may not realise the line is an input at all.
    if (placeholder) input.placeholder = placeholder;

    function promptText() {
      return 'you@quest ' + prettyCwd(engine.cwd, home) + ' $';
    }

    function refreshPrompt() {
      psEl.textContent = promptText();
    }

    function scrollToEnd() {
      scroll.scrollTop = scroll.scrollHeight;
    }

    function print(lines) {
      var html = '';
      lines.forEach(function (line) {
        var text = line.text === '' ? '&nbsp;' : esc(line.text);
        var deco = line.decoration ? '<span class="t-ref">' + esc(line.decoration) + '</span>' : '';
        html += '<div class="term-line t-' + (line.cls || 'out') + '">' + text + deco + '</div>';
      });
      outEl.insertAdjacentHTML('beforeend', html);
      scrollToEnd();
    }

    function echoCommand(text) {
      outEl.insertAdjacentHTML('beforeend',
        '<div class="term-line t-echo"><span class="term-ps">' + esc(promptText()) + '</span> '
        + esc(text) + '</div>');
    }

    function run(text, opts) {
      var line = String(text || '');
      var silent = opts && opts.silent;
      if (!silent) echoCommand(line);
      if (!line.trim()) { refreshPrompt(); scrollToEnd(); return { ok: true, lines: [] }; }

      var result = commands.run(engine, line);
      if (result.clear) outEl.innerHTML = '';
      else print(result.lines);

      history.push(line);
      historyIndex = history.length;
      refreshPrompt();
      onCommand(line, result);
      return result;
    }

    /** Tab completion: commands first, then filenames in the current directory. */
    function complete() {
      var value = input.value;
      if (!value) return;
      var matches = VERBS.filter(function (v) { return v.indexOf(value) === 0 && v !== value; });
      if (!matches.length) {
        var parts = value.split(/\s+/);
        var stub = parts[parts.length - 1];
        var names = engine.list('.').map(function (e) { return e.name; });
        var hits = names.filter(function (n) { return stub && n.indexOf(stub) === 0 && n !== stub; });
        if (hits.length === 1) {
          parts[parts.length - 1] = hits[0];
          input.value = parts.join(' ');
        } else if (hits.length > 1) {
          print([{ text: hits.join('   '), cls: 'dim' }]);
        }
        return;
      }
      if (matches.length === 1) {
        input.value = matches[0] + ' ';
      } else {
        print([{ text: matches.join('   '), cls: 'dim' }]);
      }
    }

    input.addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        var value = input.value;
        input.value = '';
        run(value);
        return;
      }
      if (event.key === 'Tab') {
        event.preventDefault();
        complete();
        return;
      }
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        if (!history.length) return;
        historyIndex = Math.max(0, historyIndex - 1);
        input.value = history[historyIndex] || '';
        return;
      }
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        if (!history.length) return;
        historyIndex = Math.min(history.length, historyIndex + 1);
        input.value = historyIndex === history.length ? '' : history[historyIndex];
      }
    });

    mount.addEventListener('click', function (event) {
      if (event.target.closest && event.target.closest('a')) return;
      if (window.getSelection && String(window.getSelection()).length) return;
      input.focus();
    });

    refreshPrompt();

    return {
      run: run,
      print: print,
      focus: function () { input.focus(); },
      setValue: function (v) { input.value = v; input.focus(); },
      clear: function () { outEl.innerHTML = ''; refreshPrompt(); },
      history: function () { return history.slice(); },
      refreshPrompt: refreshPrompt
    };
  }

  return { create: create, VERBS: VERBS, prettyCwd: prettyCwd };
}));

<script>

(function (root, factory) {

}(typeof self !== 'undefined' ? self : this, function (Agents) {

  function usernameWidget(ctx) {

      + '           value="' + esc(state.username) + '" autocomplete="off" spellcheck="false" />'

    function renderRules() {
      var value = input.value.trim();

  // --------------------------------------------------------------- 03 sorter

  var SORT_FILES = [
    { name: 'README.md', keep: true, why: 'Explains the project. The first thing anyone reads.' },

    { name: 'node_modules/', keep: false, why: 'Thousands of files your package manager rebuilds in seconds.' },
    { name: 'id_rsa', keep: false, why: 'Your private SSH key. Worse than an API key — it is your identity.' },
    { name: 'package-lock.json', keep: true, why: 'Pins exact versions so everyone builds the same thing.' },
    { name: '.DS_Store', keep: false, why: 'macOS folder noise. Pure clutter in every diff.' },
    { name: 'docs/setup.md', keep: true, why: 'Documentation belongs beside the code it documents.' },
    { name: 'aws-credentials.json', keep: false, why: 'This is the one that ends up on the news, and on your bill.' }
  ];

  function sorterWidget(ctx) {
    var state = ctx.state;
    state.answers = state.answers || {};

    function render() {
      var correct = 0;
      var rows = SORT_FILES.map(function (f, i) {
        var answer = state.answers[f.name];
        var judged = answer !== undefined;
        var right = judged && answer === f.keep;
        if (right) correct += 1;
        return '<li class="sort-row ' + (judged ? (right ? 'is-right' : 'is-wrong') : '') + '">'
          + '<code class="sort-name">' + esc(f.name) + '</code>'
          + '<div class="sort-btns">'
          + '<button class="sort-b ' + (answer === true ? 'is-on' : '') + '" data-file="' + i + '" data-keep="1">Commit it</button>'
          + '<button class="sort-b ' + (answer === false ? 'is-on' : '') + '" data-file="' + i + '" data-keep="0">Keep it out</button>'
          + '</div>'
          + (judged
            ? '<p class="sort-why">' + (right ? '' : '<strong>Not quite. </strong>') + esc(f.why) + '</p>'
            : '')
          + '</li>';
      }).join('');

      var solved = correct === SORT_FILES.length;
      state.sorterSolved = solved;

      ctx.mount.innerHTML = ''
        + '<div class="w w-sorter">'
        + '  <div class="w-head"><span class="w-title">Commit it, or keep it out?</span>'
        + '    <span class="w-sub"><span class="' + (solved ? 'ok' : '') + '">' + correct + ' of ' + SORT_FILES.length + ' right</span></span></div>'
        + '  <ul class="sort-list">' + rows + '</ul>'
        + (solved

          : '')

    ctx.mount.addEventListener('click', function (e) {

  }

  // ------------------------------------------------------------------ 06 gui

  var GUI_FILES = [
    { name: 'notes.md', add: ['- Trunk-based development'], del: [] },
    { name: 'ideas.md', add: ['# Ideas', '', '- A CLI that reads git history out loud'], del: [] }
  ];

  var VSCODE_SPOTS = [
    { id: 'changes', label: 'Changed files — this is git status' },
    { id: 'stage', label: 'The + button — this is git add' },
    { id: 'message', label: 'The message box — this is -m' },
    { id: 'sync', label: 'The sync arrows — this is push and pull' }
  ];

  function guiWidget(ctx) {
    var state = ctx.state;
    state.tab = state.tab || 'desktop';
    state.staged = state.staged || {};
    state.summary = state.summary === undefined ? '' : state.summary;

      state.guiStaged = counts();
      state.guiCommitted = !!state.committed;

  };

  function agentWidget(ctx) {
    var state = ctx.state;

    function render() {
      var ran = !!state.agentRan;
      ctx.mount.innerHTML = ''
        + '<div class="ap">'

        + '  <div class="ap-thread">'

  // ------------------------------------------------------------------ 10 rules

  function rulesWidget(ctx) {
    var state = ctx.state;

    state.answers = state.answers || {
      projectName: '', stack: '', testCommand: '', projectDescription: '',

    };

          + '<span class="ag-check">' + (on ? '✓' : '') + '</span>'
          + '<span class="ag-n">' + esc(agent.name) + '</span>'
          + '<code class="ag-f">' + esc(agent.file) + '</code></button>';
      }).join('');

      var preview = '';
      if (picked.length && state.previewAgent) {
        var tabs = picked.map(function (id) {
          return '<button class="w-tab ' + (id === state.previewAgent ? 'is-on' : '') + '" data-preview="' + id + '">'
            + esc(Agents.fileNameFor(id)) + '</button>';
        }).join('');
        preview = '<div class="w-divider"></div>'
          + '<div class="w-tabs w-tabs-sm">' + tabs + '</div>'
          + '<pre class="rules-out" data-rules-out>' + esc(generated(state.previewAgent)) + '</pre>'
          + '<div class="rules-actions">'
          + '  <button class="btn" data-rules-copy>Copy ' + esc(Agents.fileNameFor(state.previewAgent)) + '</button>'
          + '  <button class="btn btn-primary" data-rules-write>Write into the repo</button>'
          + '  <span class="rules-status" data-rules-status></span>'
          + '</div>';
      }

      ctx.mount.innerHTML = ''
        + '<div class="w w-rules">'
        + '  <div class="w-head"><span class="w-title">Your rules file</span>'
        + '    <span class="w-sub">' + (picked.length ? picked.length + ' agent' + (picked.length === 1 ? '' : 's') : 'pick at least one') + '</span></div>'
        + '  <div class="w-body">'
        + '    <div class="w-label">Which agents do you use?</div>'
        + '    <div class="ag-grid">' + cards + '</div>'
        + '    <div class="w-divider"></div>'
        + '    <div class="form-grid">'
        + '      <label class="w-label" for="r-name">Project name</label>'
        + '      <input id="r-name" class="w-input" data-r="projectName" value="' + esc(a.projectName) + '" placeholder="my-first-repo" />'
        + '      <label class="w-label" for="r-stack">Stack</label>'
        + '      <input id="r-stack" class="w-input" data-r="stack" value="' + esc(a.stack) + '" placeholder="TypeScript + React + Postgres" />'
        + '      <label class="w-label" for="r-test">How to run the tests</label>'
        + '      <input id="r-test" class="w-input" data-r="testCommand" value="' + esc(a.testCommand) + '" placeholder="npm test" />'
        + '      <label class="w-label" for="r-desc">One line: what it does</label>'
        + '      <input id="r-desc" class="w-input" data-r="projectDescription" value="' + esc(a.projectDescription) + '" placeholder="Tracks reading notes" />'
        + '    </div>'
        + '    <div class="w-label" style="margin-top:14px">Commit messages</div>'
        + '    <div class="seg">'
        + '      <button class="seg-b ' + (a.commitStyle === 'conventional' ? 'is-on' : '') + '" data-style="conventional">Conventional Commits</button>'
        + '      <button class="seg-b ' + (a.commitStyle === 'plain' ? 'is-on' : '') + '" data-style="plain">Plain sentences</button>'
        + '    </div>'
        + '    <ul class="toggles">'
        + '      <li><button class="tg ' + (a.askBeforeCommit ? 'is-on' : '') + '" data-toggle="askBeforeCommit" aria-pressed="' + !!a.askBeforeCommit + '"></button>'
        + '        <span>Show me the diff and wait before committing</span></li>'
        + '      <li><button class="tg ' + (a.noNewDeps ? 'is-on' : '') + '" data-toggle="noNewDeps" aria-pressed="' + !!a.noNewDeps + '"></button>'
        + '        <span>Ask before adding a new dependency</span></li>'
        + '    </ul>'
        + preview
        + '  </div>'
        + '</div>';
    }

    function status(message) {
      var el = ctx.mount.querySelector('[data-rules-status]');
      if (el) el.textContent = message;
    }

    ctx.mount.addEventListener('click', function (e) {
      var agent = e.target.closest('[data-agent]');
      if (agent) {
        var id = agent.getAttribute('data-agent');
        var i = state.selectedAgents.indexOf(id);
        if (i === -1) state.selectedAgents.push(id); else state.selectedAgents.splice(i, 1);
        render(); ctx.onChange(); return;
      }
      var pv = e.target.closest('[data-preview]');
      if (pv) { state.previewAgent = pv.getAttribute('data-preview'); render(); return; }
      var seg = e.target.closest('[data-style]');
      if (seg) { state.answers.commitStyle = seg.getAttribute('data-style'); render(); ctx.onChange(); return; }
      var tg = e.target.closest('[data-toggle]');
      if (tg) {
        var key = tg.getAttribute('data-toggle');
        state.answers[key] = !state.answers[key];
        render(); ctx.onChange(); return;
      }
      if (e.target.closest('[data-rules-copy]')) {
        var text = generated(state.previewAgent);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            status('Copied.');
          }, function () {
            status('Select the text above and copy it.');
          });
        } else {
          status('Select the text above and copy it.');
        }
        return;
      }
      if (e.target.closest('[data-rules-write]')) {
        var root = ctx.engine.activeRepo().root;
        var written = [];
        state.selectedAgents.forEach(function (agentId) {
          var name = Agents.fileNameFor(agentId);
          if (written.indexOf(name) !== -1) return;
          ctx.engine.writeFile(root + '/' + name, generated(agentId));
          written.push(name);
        });
        status('Wrote ' + written.join(', ') + ' — now commit it in the Terminal tab.');
        ctx.onChange();
      }
    });

    ctx.mount.addEventListener('input', function (e) {
      var field = e.target.getAttribute && e.target.getAttribute('data-r');
      if (!field) return;
      state.answers[field] = e.target.value;
      var out = ctx.mount.querySelector('[data-rules-out]');
      if (out && state.previewAgent) out.textContent = generated(state.previewAgent);
      ctx.onChange();
    });

    render();
  }

  // ----------------------------------------------------------------- dispatch

  var registry = {
    username: usernameWidget,
    sorter: sorterWidget,
    gui: guiWidget,
    agent: agentWidget,
    rules: rulesWidget
  };

  function create(type, ctx) {
    var fn = registry[type];
    if (!fn) {
      ctx.mount.innerHTML = '<p class="graph-empty">Nothing to do here.</p>';
      return;
    }
    fn(ctx);
  }

  return {
    create: create,
    SORT_FILES: SORT_FILES,
    USERNAME_RULES: USERNAME_RULES,
    AGENT_EDITS: AGENT_EDITS
  };
}));
</script>
<script>
/* js/app.js */
/**
 * app.js — wires the lesson together.
 *
 * Owns the current chapter's sandbox, renders the two (sometimes three) panes,
 * and re-runs the quest checks after every command or widget interaction.
 */
(function () {
  'use strict';

  var GitEngine = window.GQ.GitEngine.GitEngine;
  var Commands = window.GQ.Commands;
  var Chapters = window.GQ.Chapters;
  var Terminal = window.GQ.Terminal;
  var Graph = window.GQ.Graph;
  var Widgets = window.GQ.Widgets;
  var Agents = window.GQ.Agents;
  var Progress = window.GQ.Progress;
  var HOME = window.GQ.GitEngine.HOME;

  var state = Progress.touchStreak(Progress.load(), Date.now());
  Progress.save(state);

  var runtime = null;

  var el = {
    map: document.getElementById('chapter-map'),
    level: document.getElementById('hud-level'),
    xpBar: document.getElementById('hud-xp-bar'),
    xpText: document.getElementById('hud-xp-text'),
    streak: document.getElementById('hud-streak'),
    stage: document.getElementById('stage'),
    lesson: document.getElementById('lesson'),
    work: document.getElementById('work'),
    agentPane: document.getElementById('agent-pane'),
    reset: document.getElementById('btn-reset')
  };

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // --------------------------------------------------------------- lesson HTML

  function traysHtml() {
    return ''
      + '<figure class="trays">'
      + '  <div class="tray"><div class="tray-h">Working directory</div>'
      + '    <p class="tray-p">Everything on disk right now. Git watches it and promises nothing about it.</p>'
      + '    <code class="tray-c">your editor</code></div>'
      + '  <div class="tray-arrow"><span>git add</span></div>'
      + '  <div class="tray"><div class="tray-h">Staging area</div>'
      + '    <p class="tray-p">The shortlist. What the next commit will contain — and nothing else.</p>'
      + '    <code class="tray-c">git add &lt;file&gt;</code></div>'
      + '  <div class="tray-arrow"><span>git commit</span></div>'
      + '  <div class="tray is-sealed"><div class="tray-h">History</div>'
      + '    <p class="tray-p">Sealed snapshots with your name and reason on them. It only grows.</p>'
      + '    <code class="tray-c">git commit -m "…"</code></div>'
      + '</figure>';
  }

  /**
   * A labelled breakdown of the prompt. Chapter 00 leans on this: a learner who
   * has never used a terminal cannot be expected to know which part of
   * `you@quest ~/story $` is theirs to type.
   */
  function anatomyHtml() {
    var parts = [
      { text: 'you@quest', cls: 'an-user', label: 'who you are', sub: 'always "you" in here' },
      { text: '~/story', cls: 'an-where', label: 'the folder you are in', sub: '~ is your home folder' },
      { text: '$', cls: 'an-dollar', label: 'your turn', sub: 'type after this, never before' },
      { text: 'cat story.md', cls: 'an-cmd', label: 'what you type', sub: 'then press Enter' }
    ];
    // The prompt is shown once, whole, exactly as it appears in the terminal.
    // The labels sit underneath in their own grid, so a long label can never
    // stretch a column and push the end of the line out of view.
    return '<figure class="anatomy">'
      + '<code class="an-line" aria-label="The prompt: you at quest, tilde slash story, dollar sign, '
      + 'then the command cat story.md">'
      + parts.map(function (p) {
        return '<span class="an-part ' + p.cls + '">' + esc(p.text) + '</span>';
      }).join(' ')
      + '</code>'
      + '<ul class="an-keys">'
      + parts.map(function (p) {
        return '<li><span class="an-swatch ' + p.cls + '">' + esc(p.text) + '</span>'
          + '<b>' + esc(p.label) + '</b><span class="an-sub">' + esc(p.sub) + '</span></li>';
      }).join('')
      + '</ul></figure>';
  }

  function agentFilesHtml() {
    return '<div class="agentfiles">' + Agents.list.map(function (a) {
      return '<div class="af">'
        + '<div class="af-h"><span class="af-n">' + esc(a.name) + '</span>'
        + '<code class="af-f">' + esc(a.file) + '</code></div>'
        + '<p class="af-w">' + esc(a.where) + '</p>'
        + '<p class="af-g">' + esc(a.gitNote) + '</p>'
        + '</div>';
    }).join('') + '</div>';
  }

  function blockHtml(block) {
    if (block.p) return '<p>' + block.p + '</p>';
    if (block.h) return '<h3>' + esc(block.h) + '</h3>';
    if (block.note) {
      return '<aside class="note note-' + (block.kind || 'tip') + '">'
        + '<span class="note-tag">' + (block.kind === 'warn' ? 'Careful' : block.kind === 'key' ? 'The idea' : 'Tip')
        + '</span><p>' + block.note + '</p></aside>';
    }
    if (block.code) {
      return '<pre class="codeblock">' + esc(block.code) + '</pre>';
    }
    if (block.cmds) {
      return '<div class="cmds"><div class="cmds-h">Click a command to load it into the terminal</div>'
        + block.cmds.map(function (c) {
          return '<button class="cmd" data-cmd="' + esc(c.cmd) + '">'
            + '<code>' + esc(c.cmd) + '</code><span>' + esc(c.desc) + '</span>'
            + '<span class="cmd-go" aria-hidden="true">load</span></button>';
        }).join('') + '</div>';
    }
    if (block.compare) {
      return '<table class="compare"><thead><tr>'
        + block.compare.heads.map(function (h) { return '<th>' + h + '</th>'; }).join('')
        + '</tr></thead><tbody>'
        + block.compare.rows.map(function (row) {
          return '<tr>' + row.map(function (cell) { return '<td>' + cell + '</td>'; }).join('') + '</tr>';
        }).join('')
        + '</tbody></table>';
    }
    if (block.anatomy) return anatomyHtml();
    if (block.trays) return traysHtml();
    if (block.agentFiles) return agentFilesHtml();
    return '';
  }

  function questHtml(chapter, results) {
    var done = results.filter(Boolean).length;
    var total = results.length;
    var complete = done === total;

    var steps = chapter.quest.steps.map(function (step, i) {
      var isDone = results[i];
      var isCurrent = !isDone && results.slice(0, i).every(Boolean);
      return '<li class="qs ' + (isDone ? 'is-done' : '') + (isCurrent ? ' is-current' : '') + '">'
        + '<span class="qs-mark" aria-hidden="true">' + (isDone ? '✓' : isCurrent ? '▸' : '') + '</span>'
        + '<div class="qs-body">'
        + '<span class="qs-label">' + esc(step.label) + '</span>'
        + (isDone ? '' : '<button class="qs-hint" data-hint="' + i + '">Hint</button>')
        + '<p class="qs-hint-text" data-hint-text="' + i + '" hidden>' + step.hint + '</p>'
        + '</div></li>';
    }).join('');

    return '<div class="quest ' + (complete ? 'is-complete' : '') + '">'
      + '<div class="quest-h"><span class="quest-tag">Quest</span>'
      + '<span class="quest-count">' + done + ' / ' + total + '</span></div>'
      + '<h4 class="quest-t">' + esc(chapter.quest.title) + '</h4>'
      + '<p class="quest-b">' + chapter.quest.brief + '</p>'
      + '<ul class="qs-list">' + steps + '</ul>'
      + (complete
        ? '<div class="quest-done">'
          + '<p class="quest-outro">' + chapter.outro + '</p>'
          + '<div class="quest-done-row">'
          + '<span class="xp-won">+' + chapter.xp + ' XP</span>'
          + (chapter.n < Chapters.list.length - 1
            ? '<button class="btn btn-primary" data-next>Next: ' + esc(Chapters.list[chapter.n + 1].title) + ' →</button>'
            : '<button class="btn btn-primary" data-finish>Finish the lesson</button>')
          + '</div></div>'
        : '')
      + '</div>';
  }

  function renderLesson() {
    var chapter = runtime.chapter;
    var results = runtime.results;
    el.lesson.innerHTML = ''
      + '<div class="lesson-inner">'
      + '  <div class="ch-eyebrow">Chapter ' + (chapter.n < 10 ? '0' : '') + chapter.n
      + (chapter.personalised ? ' <span class="ch-tag">personalised</span>' : '') + '</div>'
      + '  <h2 class="ch-title">' + esc(chapter.title) + '</h2>'
      + '  <p class="ch-sub">' + esc(chapter.subtitle) + '</p>'
      // The quest sits above the prose on purpose: the objective is what the
      // learner should see first, and the completion card should never be
      // something they have to scroll to find.
      + questHtml(chapter, results)
      + '  <div class="prose">' + chapter.blocks.map(blockHtml).join('') + '</div>'
      + '</div>';
    el.lesson.scrollTop = runtime.lessonScroll || 0;
  }

  // ----------------------------------------------------------------- work pane

  function workTabsHtml(chapter) {
    var tabs = [];
    if (chapter.widget) {
      tabs.push({ id: 'widget', label: widgetLabel(chapter.widget) });
    }
    tabs.push({ id: 'terminal', label: 'Terminal' });
    if (tabs.length === 1) return '';
    return '<div class="work-tabs">' + tabs.map(function (t) {
      return '<button class="work-tab ' + (runtime.pane === t.id ? 'is-on' : '') + '" data-pane="' + t.id + '">'
        + esc(t.label) + '</button>';
    }).join('') + '</div>';
  }

  function widgetLabel(type) {
    return {
      username: 'Sign-up',
      sorter: 'Sort the files',
      gui: 'Desktop clients',
      rules: 'Rules builder'
    }[type] || 'Workbench';
  }

  function renderWork() {
    var chapter = runtime.chapter;
    el.work.innerHTML = workTabsHtml(chapter)
      + '<div class="work-body" data-work-body></div>';
    var body = el.work.querySelector('[data-work-body]');

    if (runtime.pane === 'widget' && chapter.widget) {
      body.innerHTML = '<div class="widget-scroll" data-widget-mount></div>';
      Widgets.create(chapter.widget, {
        mount: body.querySelector('[data-widget-mount]'),
        engine: runtime.eng,
        state: runtime.widget,
        onChange: evaluate
      });
      return;
    }

    body.innerHTML = ''
      + '<div class="term" data-term></div>'
      + '<div class="graph"><div class="graph-h">Your history</div>'
      + '<div class="graph-body" data-graph></div></div>';

    runtime.terminal = Terminal.create({
      mount: body.querySelector('[data-term]'),
      engine: runtime.eng,
      commands: Commands,
      home: HOME,
      placeholder: chapter.terminalHint || '',
      onCommand: function (line) {
        runtime.history.push(line.trim());
        drawGraph();
        evaluate();
      }
    });
    if (runtime.termBuffer && runtime.termBuffer.length) {
      runtime.terminal.print(runtime.termBuffer);
    } else {
      runtime.terminal.print([
        { text: 'Sandbox ready — this is a pretend computer, not yours.', cls: 'dim' },
        { text: 'Click a command on the left, or type one here, then press Enter.', cls: 'dim' },
        { text: 'Type `help` any time to see everything this shell understands.', cls: 'dim' },
        { text: '' }
      ]);
    }
    drawGraph();
    runtime.terminal.focus();
  }

  function drawGraph() {
    var target = el.work.querySelector('[data-graph]');
    if (target) target.innerHTML = Graph.render(runtime.eng);
  }

  function renderAgentPane() {
    var chapter = runtime.chapter;
    if (!chapter.agentPane) {
      el.agentPane.hidden = true;
      el.stage.classList.remove('has-agent');
      return;
    }
    el.agentPane.hidden = false;
    el.stage.classList.add('has-agent');
    var picked = state.agents && state.agents.length ? state.agents : ['claude-code'];
    var agent = Agents.byId(picked[0]) || Agents.list[0];
    Widgets.create('agent', {
      mount: el.agentPane,
      engine: runtime.eng,
      state: runtime.widget,
      agentName: agent.name,
      onChange: function () {
        drawGraph();
        evaluate();
      }
    });
  }

  // ------------------------------------------------------------------- header

  function renderHud() {
    var level = Progress.levelFor(state.xp);
    var progress = Progress.levelProgress(state.xp);
    el.level.textContent = 'LVL ' + level;
    el.xpBar.style.width = progress.pct + '%';
    el.xpText.textContent = state.xp + ' / ' + Chapters.totalXp + ' XP';
    el.streak.textContent = state.streak + '-day streak';

    el.map.innerHTML = Chapters.list.map(function (c) {
      var done = !!state.completed[c.id];
      var here = runtime && runtime.chapter.id === c.id;
      return '<button class="node ' + (done ? 'is-done' : '') + (here ? ' is-here' : '') + '"'
        + ' data-goto="' + c.n + '" title="' + esc(c.title) + '"'
        + ' aria-label="Chapter ' + c.n + ': ' + esc(c.title) + (done ? ' (complete)' : '') + '"'
        + ' aria-current="' + (here ? 'step' : 'false') + '">'
        + (done ? '✓' : (c.n < 10 ? '0' + c.n : c.n)) + '</button>';
    }).join('');
  }

  // ------------------------------------------------------------------- checks

  function evaluate() {
    var chapter = runtime.chapter;
    var ctx = {
      eng: runtime.eng,
      history: runtime.history,
      flags: runtime.flags,
      widget: runtime.widget
    };
    var results = chapter.quest.steps.map(function (step) {
      try {
        return !!step.check(ctx);
      } catch (e) {
        return false;
      }
    });
    var wasComplete = runtime.results.every(Boolean) && runtime.results.length > 0;
    runtime.results = results;
    var isComplete = results.every(Boolean);

    if (isComplete && !state.completed[chapter.id]) {
      state.completed[chapter.id] = true;
      state.xp += chapter.xp;
      Progress.save(state);
      renderHud();
      celebrate();
    } else if (isComplete !== wasComplete) {
      renderHud();
    }

    runtime.lessonScroll = el.lesson.scrollTop;
    renderLesson();
    return results;
  }

  function celebrate() {
    document.body.classList.add('is-levelled');
    window.setTimeout(function () { document.body.classList.remove('is-levelled'); }, 1400);
  }

  // -------------------------------------------------------------- chapter life

  function startChapter(index, opts) {
    var chapter = Chapters.list[Math.max(0, Math.min(index, Chapters.list.length - 1))];
    var eng = new GitEngine();
    chapter.setup(eng);

    runtime = {
      chapter: chapter,
      eng: eng,
      history: [],
      flags: {},
      widget: {},
      results: [],
      pane: chapter.pane === 'widget' && chapter.widget ? 'widget' : 'terminal',
      lessonScroll: 0
    };

    // Carry the learner's own answers into the personalised chapters.
    if (chapter.widget === 'rules') {
      runtime.widget.selectedAgents = (state.agents || []).slice();
      if (state.answers && Object.keys(state.answers).length) {
        runtime.widget.answers = JSON.parse(JSON.stringify(state.answers));
      }
    }
    if (chapter.widget === 'username' && state.username) {
      runtime.widget.username = state.username;
    }

    state.chapter = chapter.n;
    Progress.save(state);

    renderHud();
    renderWork();
    renderAgentPane();
    evaluate();
    if (!opts || !opts.keepScroll) el.lesson.scrollTop = 0;
    document.title = 'Git Quest — ' + chapter.title;
  }

  function persistAnswers() {
    if (!runtime || runtime.chapter.widget !== 'rules') return;
    if (runtime.widget.selectedAgents) state.agents = runtime.widget.selectedAgents.slice();
    if (runtime.widget.answers) state.answers = JSON.parse(JSON.stringify(runtime.widget.answers));
    if (runtime.widget.username) state.username = runtime.widget.username;
    Progress.save(state);
  }

  // ------------------------------------------------------------------ events

  el.map.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-goto]');
    if (!btn) return;
    persistAnswers();
    startChapter(Number(btn.getAttribute('data-goto')));
  });

  el.work.addEventListener('click', function (e) {
    var tab = e.target.closest('[data-pane]');
    if (!tab) return;
    persistAnswers();
    if (runtime.pane === 'terminal' && runtime.terminal) {
      runtime.termBuffer = null;
    }
    runtime.pane = tab.getAttribute('data-pane');
    renderWork();
    evaluate();
  });

  el.lesson.addEventListener('click', function (e) {
    var cmd = e.target.closest('[data-cmd]');
    if (cmd) {
      if (runtime.pane !== 'terminal') {
        runtime.pane = 'terminal';
        renderWork();
      }
      if (runtime.terminal) runtime.terminal.setValue(cmd.getAttribute('data-cmd'));
      return;
    }
    var hint = e.target.closest('[data-hint]');
    if (hint) {
      var i = hint.getAttribute('data-hint');
      var text = el.lesson.querySelector('[data-hint-text="' + i + '"]');
      if (text) {
        text.hidden = !text.hidden;
        hint.textContent = text.hidden ? 'Hint' : 'Hide hint';
      }
      return;
    }
    if (e.target.closest('[data-next]')) {
      persistAnswers();
      startChapter(runtime.chapter.n + 1);
      return;
    }
    if (e.target.closest('[data-finish]')) {
      persistAnswers();
      showFinish();
    }
  });

  el.reset.addEventListener('click', function () {
    startChapter(runtime.chapter.n);
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input, textarea')) return;
    if (e.key === '[' && runtime.chapter.n > 0) startChapter(runtime.chapter.n - 1);
    if (e.key === ']' && runtime.chapter.n < Chapters.list.length - 1) startChapter(runtime.chapter.n + 1);
  });

  function showFinish() {
    var picked = (state.agents || []).map(function (id) {
      var a = Agents.byId(id);
      return a ? a.name + ' (' + Agents.fileNameFor(id) + ')' : id;
    });
    el.lesson.innerHTML = ''
      + '<div class="lesson-inner finish">'
      + '  <div class="ch-eyebrow">Complete</div>'
      + '  <h2 class="ch-title">You can use git now</h2>'
      + '  <p class="ch-sub">' + state.xp + ' XP, ' + Object.keys(state.completed).length
      + ' of ' + Chapters.list.length + ' chapters.</p>'
      + '  <div class="prose">'
      + '    <p>Everything below is a thing you actually did, not a thing you read:</p>'
      + '    <ul class="finish-list">'
      + '      <li>Recovered a file you destroyed on purpose</li>'
      + '      <li>Turned a folder into a repository and made your first commit</li>'
      + '      <li>Kept a live API key out of history with <code>.gitignore</code></li>'
      + '      <li>Pushed to GitHub and understood what <code>origin</code> means</li>'
      + '      <li>Ran the loop twice and split two ideas into two commits</li>'
      + '      <li>Did the same thing with buttons, and knew what they were doing</li>'
      + '      <li>Branched, merged, reverted, and found the commit again in the reflog</li>'
      + '      <li>Resolved a merge conflict by hand</li>'
      + '      <li>Caught an agent doing something its summary did not mention</li>'
      + '      <li>Wrote a rules file' + (picked.length ? ' for ' + esc(picked.join(' and ')) : '') + '</li>'
      + '    </ul>'
      + '    <h3>Do this next, today</h3>'
      + '    <p>Open a real terminal. <code>cd</code> into a folder you care about, run <code>git init</code>, '
      + '    write a <code>.gitignore</code>, and make one commit. The whole lesson was practice for those four minutes.</p>'
      + '    <p>Then paste your rules file into the same folder. The next agent that opens it will read your rules '
      + '    before it touches a single line.</p>'
      + '  </div>'
      + '  <div class="quest-done-row" style="margin-top:20px">'
      + '    <button class="btn" data-goto-start>Back to chapter 00</button>'
      + '    <button class="btn" data-wipe>Reset all progress</button>'
      + '  </div>'
      + '</div>';

    el.lesson.querySelector('[data-goto-start]').addEventListener('click', function () {
      startChapter(0);
    });
    el.lesson.querySelector('[data-wipe]').addEventListener('click', function () {
      state = Progress.touchStreak(Progress.reset(), Date.now());
      Progress.save(state);
      startChapter(0);
    });
  }

  startChapter(state.chapter || 0);
}());
</script>
