name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  # Lets you redeploy from the Actions tab without pushing anything.
  workflow_dispatch:

# Pages needs these; the default GITHUB_TOKEN does not have them.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel one in progress — a half-finished deploy
# is what testers would be looking at.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Cheap insurance: the logic tests need no browser and take about a
      # second, and they are the difference between shipping testers a working
      # lesson and shipping them a blank page.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      # dist/ becomes the site root, so dist/index.html is served at /.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
