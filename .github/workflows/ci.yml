name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-ai-config:
    name: Validate AI Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run AI config validator
        run: python scripts/validate-ai-config.py

  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # There are no runtime dependencies, so there is nothing to install and
      # no lockfile to cache. `npm ci` would fail for want of one.

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # The end-to-end tests skip themselves when no browser is present, which
      # would quietly hide a regression here. ubuntu-latest ships Chrome, so
      # point at it explicitly and fail if it has gone missing.
      - name: Locate Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::No Chrome binary on the runner — the e2e tests would silently skip."
            exit 1
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: End-to-end tests
        run: node --test "tests/e2e/*.test.mjs"

      - name: Upload built page
        uses: actions/upload-artifact@v4
        with:
          name: git-quest
          path: dist/
          if-no-files-found: error
